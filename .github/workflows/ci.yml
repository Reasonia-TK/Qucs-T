name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: CLI and MCP smoke tests
        shell: bash
        run: |
          B=target/release/qucs-t
          $B --version
          $B steady examples/heatsink.qucst > target/steady.json
          $B transient examples/heatsink.qucst target/transient.csv
          python tests/e2e_thermal_mcp.py "$B"
          $B render examples/heatsink.qucst target/smoke.png > /dev/null
          $B check examples/heatsink.qucst > /dev/null
      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: qucs-t-windows
          path: target/release/qucs-t.exe
